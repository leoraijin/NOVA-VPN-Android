name: Pinned Cronet build graph
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cronet-graph-${{ github.ref }}
  cancel-in-progress: false
jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify dependency evidence parser
        run: python3 -B native/xhttp/build/Test-CronetDependencies.py
      - name: Verify and restore pinned source identity and modes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/cronet-evidence
          python3 native/xhttp/build/Fetch-CronetSource.py --output work/cronet-inputs 2>&1 | tee work/cronet-evidence/fetch.log
          python3 native/xhttp/build/Restore-CronetTree.py --input work/cronet-inputs --output work/cronet-tree 2>&1 | tee work/cronet-evidence/restore.log
          cp work/restoration.json work/cronet-evidence/restoration.json
          cp work/cronet-inputs/verification.json work/cronet-evidence/input-verification.json
      - name: Generate all Android ABI graphs and rebuild ARM64
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja
          for cpu in arm x64 x86; do
            python3 native/xhttp/build/Generate-CronetGraph.py --source work/cronet-tree --work "work/cronet-evidence/graph-$cpu" --cpu "$cpu"
          done
          python3 native/xhttp/build/Generate-CronetGraph.py --source work/cronet-tree --work work/cronet-evidence/graph-arm64 --cpu arm64 --rebuild
      - name: Capture actual ARM64 compiler dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f work/cronet-tree/src/out/cronet-android-arm64/.ninja_deps; then
            python3 native/xhttp/build/Collect-CronetDependencies.py --source work/cronet-tree/src --out work/cronet-tree/src/out/cronet-android-arm64 --output work/cronet-evidence/compiler-dependencies
          else
            echo 'No ARM64 Ninja dependency database was produced'
          fi
      - name: Retain graph attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cronet-graph-evidence
          path: work/cronet-evidence/
          if-no-files-found: warn
          retention-days: 30
