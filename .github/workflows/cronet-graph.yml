name: Pinned Cronet build graph
run-name: Cronet ${{ inputs.rebuild_cpu }} independent rebuild
on:
  workflow_dispatch:
    inputs:
      rebuild_cpu:
        description: Android CPU for independent C++ archive reproduction
        type: choice
        options: [arm64, arm, x64, x86]
        default: arm64
        required: true
permissions:
  contents: read
concurrency:
  group: cronet-graph-${{ github.ref }}-${{ inputs.rebuild_cpu }}
  cancel-in-progress: false
jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REBUILD_CPU: ${{ inputs.rebuild_cpu }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify dependency and provenance evidence handling
        run: |
          python3 -B native/xhttp/build/Test-CronetDependencies.py
          python3 -B native/xhttp/build/Test-NativeProvenance.py
      - name: Verify and restore pinned source identity and modes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/cronet-evidence
          python3 native/xhttp/build/Fetch-CronetSource.py --output work/cronet-inputs 2>&1 | tee work/cronet-evidence/fetch.log
          python3 native/xhttp/build/Restore-CronetTree.py --input work/cronet-inputs --output work/cronet-tree 2>&1 | tee work/cronet-evidence/restore.log
          cp work/restoration.json work/cronet-evidence/restoration.json
          cp work/cronet-inputs/verification.json work/cronet-evidence/input-verification.json
      - name: Generate additional Android ABI graphs
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja
          case "$REBUILD_CPU" in arm64|arm|x64|x86) ;; *) exit 2 ;; esac
          for cpu in arm64 arm x64 x86; do
            if test "$cpu" = "$REBUILD_CPU"; then continue; fi
            python3 native/xhttp/build/Generate-CronetGraph.py --source work/cronet-tree --work "work/cronet-evidence/graph-$cpu" --cpu "$cpu"
          done
      - name: Retain additional ABI graphs before long compilation
        uses: actions/upload-artifact@v4
        with:
          name: cronet-additional-abi-graphs
          path: work/cronet-evidence/graph-*/
          if-no-files-found: error
          retention-days: 30
      - name: Generate selected graph and rebuild its archive
        shell: bash
        run: |
          set -euo pipefail
          python3 native/xhttp/build/Generate-CronetGraph.py --source work/cronet-tree --work "work/cronet-evidence/graph-$REBUILD_CPU" --cpu "$REBUILD_CPU" --rebuild
      - name: Capture actual compiler dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "work/cronet-tree/src/out/cronet-android-$REBUILD_CPU/.ninja_deps"; then
            python3 native/xhttp/build/Collect-CronetDependencies.py --source work/cronet-tree/src --out "work/cronet-tree/src/out/cronet-android-$REBUILD_CPU" --output work/cronet-evidence/compiler-dependencies
          else
            echo 'No selected-ABI Ninja dependency database was produced'
          fi
      - name: Retain graph attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cronet-graph-evidence
          path: work/cronet-evidence/
          if-no-files-found: warn
          retention-days: 30
