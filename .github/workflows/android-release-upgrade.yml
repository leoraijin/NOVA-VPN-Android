name: Exact release APK upgrade acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Short-lived read-only GitHub CDN URL for the exact candidate APK
        type: string
        required: true
      candidate_sha256:
        description: SHA-256 verified locally before the draft upload
        type: string
        required: true
        default: '60571ad84bf834a8582852be6de487936bfb9cb95c7d13a10ff7441d82e81925'
permissions:
  contents: read
concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch and verify exact signed APKs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p work/apks work/acceptance
          python3 -m py_compile tools/Verify-ReleaseUpgrade.py
          python3 -m unittest discover -s tools -p test_release_upgrade_ui.py
          python3 - <<'PY'
          import json, os, pathlib, shutil, urllib.parse, urllib.request
          url = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']['candidate_url']
          def allowed(value):
              parsed = urllib.parse.urlsplit(value)
              return (len(value) <= 8192 and not any(ord(c) < 32 or ord(c) == 127 for c in value) and
                      parsed.scheme == 'https' and parsed.hostname in ('release-assets.githubusercontent.com', 'objects.githubusercontent.com') and
                      parsed.username is None and parsed.password is None and parsed.port in (None, 443) and
                      parsed.path.startswith('/github-production-release-asset'))
          if not allowed(url):
              raise RuntimeError('Invalid scoped candidate download URL')
          print('::add-mask::' + url, flush=True)
          class ScopedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not allowed(newurl):
                      raise RuntimeError('Unexpected candidate redirect')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          with urllib.request.build_opener(ScopedRedirect()).open(url, timeout=120) as response:
              with pathlib.Path('work/apks/candidate.apk').open('wb') as output:
                  shutil.copyfileobj(response, output)
          print('Downloaded exact candidate through scoped read-only URL')
          PY
          curl -fLsS --retry 3 https://github.com/leoraijin/NOVA-VPN-Android/releases/download/v0.2.52/NOVA-VPN-Android-0.2.52-arm64-optimized.apk -o work/apks/0.2.52.apk
          curl -fLsS --retry 3 https://github.com/leoraijin/NOVA-VPN-Android/releases/download/v0.2.54/NOVA-VPN-Android-0.2.54-arm64-optimized.apk -o work/apks/0.2.54.apk
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          expected = {'candidate.apk': os.environ['CANDIDATE_SHA'],
                      '0.2.52.apk': 'dbbaff9bcb63b248f2abe869eb30f552ac308cd7d3bed1e1e2138cbe4a4a008b',
                      '0.2.54.apk': '44e5277f2b2aa63294eecdc5a0ef7d8cba375d9a1743ebca6debef73c3c9c274'}
          signer = '7abeb400a6f16c0adf6c127027f2bdd205ce79f558c53f631d41083ecca24626'
          for name, digest in expected.items():
              path = pathlib.Path('work/apks') / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              result = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/apksigner', 'verify', '--print-certs', str(path)], text=True)
              assert signer in result, name
          print('PASS all three exact APK digests and original signer')
          PY
      - name: Enable KVM in disposable runner
        run: sudo chmod 666 /dev/kvm
      - name: Check exact package install and data-preserving updates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: python3 tools/Verify-ReleaseUpgrade.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --apks work/apks --work work/acceptance/result
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-apk-upgrade-evidence
          path: work/acceptance/
          if-no-files-found: warn
          retention-days: 14