name: Build MagAmp APK
on:
  push:
    branches: [build/magamp-apk-20261016]
    paths:
      - "magamp-build/**"
      - ".github/workflows/magamp-apk.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack source
        run: |
          mkdir -p magamp-build/source
          base64 -d magamp-build/magamp-src.tar.xz.b64 | tar -xJ -C magamp-build/source
      - name: Assemble debug APK
        working-directory: magamp-build/source
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagAmp-APK
          path: magamp-build/source/app/build/outputs/apk/debug/app-debug.apk
