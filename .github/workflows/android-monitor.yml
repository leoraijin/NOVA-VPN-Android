name: Android physical monitor lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build isolated preview and lifecycle instrumentation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/monitor
          bash gradlew --no-daemon -PnovaOfficialRepositoriesOnly=true '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:assembleRealitypreview :app:assembleRealitypreviewAndroidTest -PnovaRealitySmoke -PnovaUsbTest -PnovaRealityAbi=x86_64 2>&1 | tee work/monitor/build.log
      - name: Enable disposable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Check actual Android registration lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/Run-MonitorChecksCi.sh
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-monitor-lifecycle-evidence
          path: work/monitor/
          if-no-files-found: warn
          retention-days: 14
