name: Android VPN exit recovery acceptance
on:
  push:
    branches: ['codex/android-exit-recovery-qa']
permissions:
  contents: read
  actions: read
jobs:
  tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore the verified Reality Core for x86_64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 44473405174 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha | grep -Fx '82d8dc34f046b9d205378c66e1ae504de385f3c7'
          mkdir -p work/exit-recovery-acceptance app/src/main/jniLibs/x86_64
          gh run download 44473405174 --repo "$GITHUB_REPOSITORY" --name reality-android-native-x86_64 --dir work/exit-recovery-acceptance/native
          cp work/exit-recovery-acceptance/native/app/src/main/jniLibs/x86_64/*.so app/src/main/jniLibs/x86_64/
          (cd app/src/main/jniLibs/x86_64; printf '%s\n' '5f759999cd7235ab1be784bf9c03a2ed27c96300a69f16d9c0d043b2fad87598  libreality.so' '088e50f77125b5865169012ff96c08b5771847f79a6759dff0ac7572209a67bb  libnova_reality_jni.so' | sha256sum -c)
      - name: Compile the isolated app and instrumentation
        run: |
          set -euo pipefail
          bash gradlew --no-daemon -PnovaOfficialRepositoriesOnly=true '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:assembleRealitypreview :app:assembleRealitypreviewAndroidTest -PnovaRealitySmoke -PnovaUsbTest -PnovaUsbTestSlot=completionpreview -PnovaRealityAbi=x86_64 -PnovaRealityDualSmoke 2>&1 | tee work/exit-recovery-acceptance/build.log
      - name: Enable disposable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Check actual Reality Core and sing-box tunnels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/Run-ExitRecoveryAcceptance.sh
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-exit-recovery-acceptance
          path: work/exit-recovery-acceptance/*.log
          if-no-files-found: warn
          retention-days: 14
