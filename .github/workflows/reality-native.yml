name: Experimental Reality native libraries
on:
  workflow_dispatch:
  push:
    branches: [experiment/reality-core]
    paths: ['native/**', '.github/workflows/reality-native.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - run: cargo install cargo-ndk --locked --version 3.5.4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'
      - name: Build pinned core and JNI bridge
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: bash native/build-reality.sh '${{ matrix.abi }}'
      - name: Native unit tests
        if: matrix.abi == 'arm64-v8a'
        working-directory: native/work/core
        run: |
          cargo test --locked -p reality-ffi
          cargo test --locked -p reality-core --lib
      - name: Dependency license notices
        if: matrix.abi == 'arm64-v8a'
        working-directory: native/work/core
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          bash scripts/third_party_licenses.sh ../../../THIRD-PARTY-LICENSES.html
          cargo vendor --locked ../dependencies
          tar -czf ../reality-dependencies.tar.gz -C .. dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reality-android-native-${{ matrix.abi }}
          path: |
            app/src/main/jniLibs/
            native/REALITY-LICENSE
            native/work/reality-core-source.tar
            native/work/reality-dependencies.tar.gz
            THIRD-PARTY-LICENSES.html
          retention-days: 30
