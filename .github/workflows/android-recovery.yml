name: Android Reality Core UDP acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  udp-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch x86_64 core from the candidate native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 44382300509 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha | grep -Fx '1439ffe6e5ce7ef5d4dcd03ef4bb3a2a3e59546f'
          mkdir -p work/acceptance/native app/src/main/jniLibs/x86_64
          for attempt in $(seq 1 32); do
            if gh run download 44382300509 --repo "$GITHUB_REPOSITORY" --name reality-android-native-x86_64 --dir work/acceptance/native; then break; fi
            sleep 15
          done
          cp work/acceptance/native/app/src/main/jniLibs/x86_64/*.so app/src/main/jniLibs/x86_64/
          sha256sum app/src/main/jniLibs/x86_64/*.so | tee work/acceptance/core-sha256.txt
      - name: Build the isolated VpnService and independent-UID test app
        run: |
          set -euo pipefail
          bash gradlew --no-daemon -PnovaOfficialRepositoriesOnly=true '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:assembleRealitypreview :app:assembleRealitypreviewAndroidTest -PnovaRealitySmoke -PnovaUsbTest -PnovaRealityAbi=x86_64 -PnovaRealityDualSmoke -PnovaUsbTestSlot=completionpreview 2>&1 | tee work/acceptance/build.log
      - name: Enable KVM in disposable test runner
        run: sudo chmod 666 /dev/kvm
      - name: Check real Android TUN after IPv4 fragments and try HTTP/3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/Run-RealityUdpAcceptance.sh
      - name: Keep Android test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-reality-udp-acceptance
          path: |
            work/acceptance/*.log
            work/acceptance/*.txt
          if-no-files-found: warn
          retention-days: 14
