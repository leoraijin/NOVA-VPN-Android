name: Android data recovery and diagnostics
on:
  workflow_dispatch:
    inputs:
      library_only:
        description: 'Run only the unresolved library background-process saved-state check'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOVA_LIBRARY_ONLY: ${{ inputs.library_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build isolated recovery instrumentation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/recovery
          bash gradlew --no-daemon -PnovaOfficialRepositoriesOnly=true '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:assembleRealitypreview :app:assembleRealitypreviewAndroidTest -PnovaRealitySmoke -PnovaUsbTest -PnovaRealityAbi=x86_64 2>&1 | tee work/recovery/build.log
      - name: Enable disposable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Check process death and diagnostic exports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/Run-RecoveryChecksCi.sh
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovery-lifecycle-evidence
          path: work/recovery/
          if-no-files-found: warn
          retention-days: 14
