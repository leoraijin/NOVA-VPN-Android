name: Android direct app routing acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Use the candidate x86_64 core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 44473405174 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha | grep -Fx '82d8dc34f046b9d205378c66e1ae504de385f3c7'
          mkdir -p work/direct/native app/src/main/jniLibs/x86_64
          for attempt in $(seq 1 44); do
            if gh run download 44473405174 --repo "$GITHUB_REPOSITORY" --name reality-android-native-x86_64 --dir work/direct/native; then break; fi
            sleep 15
          done
          cp work/direct/native/app/src/main/jniLibs/x86_64/*.so app/src/main/jniLibs/x86_64/
          sha256sum app/src/main/jniLibs/x86_64/*.so | tee work/direct/core-sha256.txt
      - name: Build the VPN service and both isolated probe UIDs
        run: |
          set -euo pipefail
          bash gradlew --no-daemon -PnovaOfficialRepositoriesOnly=true '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:assembleRealitypreview :app:assembleRealitypreviewAndroidTest -PnovaRealitySmoke -PnovaUsbTest -PnovaUsbTestSlot=completionpreview -PnovaRealityAbi=x86_64 -PnovaRealityDualSmoke 2>&1 | tee work/direct/build.log
          root=work/direct/probe
          mkdir -p "$root/classes" "$root/dex"
          sdk="$ANDROID_HOME/platforms/android-35/android.jar"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mapfile -t sources < <(find tools/routing-probe/src -name '*.java')
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$sdk" -d "$root/classes" "${sources[@]}" app/src/androidTest/java/com/nova/vpn/android/RoutingTxtProbe.java
          mapfile -t classes < <(find "$root/classes" -name '*.class')
          "$tools/d8" --lib "$sdk" --min-api 29 --output "$root/dex" "${classes[@]}"
          "$tools/aapt2" link -I "$sdk" --manifest tools/routing-probe/AndroidManifest.xml -o "$root/base.apk"
          (cd "$root/dex"; zip ../base.apk classes.dex)
          "$tools/zipalign" -f 4 "$root/base.apk" "$root/aligned.apk"
          keytool -genkeypair -keystore "$root/probe.jks" -storetype JKS -storepass android -keypass android -alias fixture -dname 'CN=Local test fixture' -keyalg RSA -keysize 2048 -validity 30 -noprompt
          "$tools/apksigner" sign --ks "$root/probe.jks" --ks-pass pass:android --out "$root/probe.apk" "$root/aligned.apk"
      - name: Enable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify direct physical TCP, active VPN exits and route switching
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/Run-DirectAndroidAcceptance.sh
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-direct-route-evidence
          path: |
            work/direct/*.log
            work/direct/*.txt
          if-no-files-found: warn
          retention-days: 14
